<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Acceso privado a PokeBot" />
    <title>PokeBot</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="ambient" aria-hidden="true"></div>

    <main class="page">
      <section class="identity" aria-labelledby="titulo">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">PB</span>
          <span>PokeBot</span>
        </div>
        <h1 id="titulo">Entrenado por quienes mejor lo conocen.</h1>
      </section>

      <section class="auth" aria-labelledby="acceso-titulo">
        <div id="acceso">
          <h2 id="acceso-titulo">Acceso privado</h2>
          <a class="button button-primary" href="/api/auth/discord">
            <span>Continuar con Discord</span>
            <span aria-hidden="true">→</span>
          </a>
          <p>Solo para amigos autorizados.</p>
        </div>

        <div id="sesion" class="session" hidden>
          <div class="session-user">
            <span class="session-avatar" aria-hidden="true">
              <img id="sesion-imagen" class="session-image" alt="" hidden />
              <span id="sesion-inicial">U</span>
            </span>
            <div class="session-copy">
              <span>Sesión iniciada</span>
              <strong id="sesion-nombre"></strong>
            </div>
          </div>
          <form action="/api/auth/logout" method="post">
            <button class="button button-secondary" type="submit">Cerrar sesión</button>
          </form>
        </div>

        <div class="health" aria-live="polite">
          <span class="health-dot" aria-hidden="true"></span>
          <span id="estado">Comprobando conexión...</span>
        </div>
      </section>
    </main>

    <script>
      const estado = document.querySelector("#estado");
      const acceso = document.querySelector("#acceso");
      const sesion = document.querySelector("#sesion");
      const sesionNombre = document.querySelector("#sesion-nombre");
      const sesionImagen = document.querySelector("#sesion-imagen");
      const sesionInicial = document.querySelector("#sesion-inicial");

      fetch("/api/health")
        .then((respuesta) => {
          estado.textContent = respuesta.ok ? "PokeBot disponible" : "PokeBot no disponible";
          document.body.dataset.health = respuesta.ok ? "ok" : "error";
        })
        .catch(() => {
          estado.textContent = "PokeBot no disponible";
          document.body.dataset.health = "error";
        });

      fetch("/api/me")
        .then((respuesta) => respuesta.json())
        .then(({ usuario }) => {
          if (!usuario) return;
          acceso.hidden = true;
          sesion.hidden = false;
          sesionNombre.textContent = usuario.nombre;
          sesionInicial.textContent = usuario.nombre.trim().charAt(0).toUpperCase() || "U";

          if (usuario.avatarUrl) {
            sesionImagen.src = usuario.avatarUrl;
            sesionImagen.hidden = false;
            sesionInicial.hidden = true;
            sesionImagen.addEventListener("error", () => {
              sesionImagen.hidden = true;
              sesionInicial.hidden = false;
            }, { once: true });
          }
        })
        .catch(() => {
          acceso.hidden = false;
        });
    </script>
  </body>
</html>
